<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selector de stock</title>
  <style>
    :root {
      color: #17171a;
      background: #faf9fb;
      font-family: Inter, "SF Pro Display", "SF Pro Text", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      --purple: #81638b;
      --purple-soft: #b695c0;
      --lavender: #dac9df;
      --blue: #2196f3;
      --blue-soft: #81c9fa;
      --muted: #68666d;
      --surface: #ffffff;
      --surface-soft: #f6f5f8;
      --line: rgba(129, 99, 139, .15);
      --brand: linear-gradient(135deg, #81638b 0%, #2196f3 100%);
    }
    * { box-sizing: border-box; }
    html { background: #faf9fb; }
    body { min-width: 320px; margin: 0; overflow-x: hidden; background: radial-gradient(circle at 85% 2%, rgba(129, 201, 250, .15), transparent 25rem), radial-gradient(circle at 8% 8%, rgba(218, 201, 223, .22), transparent 24rem), #faf9fb; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(1340px, calc(100% - 40px)); margin: 42px auto 56px; }
    .header { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; margin-bottom: 30px; padding: 8px 4px; }
    .header::after { position: absolute; bottom: -14px; left: 4px; width: 72px; height: 3px; border-radius: 99px; background: var(--brand); content: ""; }
    .eyebrow { margin: 0 0 8px; color: var(--purple); font-size: .74rem; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.15rem, 4.5vw, 3.65rem); font-weight: 780; letter-spacing: -.06em; line-height: .98; }
    .subtitle { max-width: 680px; margin: 14px 0 0; color: var(--muted); font-size: 1rem; line-height: 1.55; }
    .stock-badge { display: inline-flex; align-items: center; gap: 9px; padding: 11px 15px; border: 1px solid rgba(129, 99, 139, .14); border-radius: 999px; background: linear-gradient(135deg, rgba(218, 201, 223, .34), rgba(129, 201, 250, .2)); box-shadow: 0 8px 24px rgba(64, 44, 71, .06); color: #57425f; font-size: .82rem; font-weight: 760; white-space: nowrap; }
    .stock-badge::before { width: 8px; height: 8px; border-radius: 50%; background: #25a86b; box-shadow: 0 0 0 4px rgba(37, 168, 107, .12); content: ""; }
    .layout { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 22px; align-items: start; }
    .sidebar { position: sticky; top: 18px; display: grid; gap: 18px; }
    .panel { border: 1px solid var(--line); border-radius: 24px; background: rgba(255, 255, 255, .96); box-shadow: 0 16px 46px rgba(42, 31, 47, .065); }
    .filters-panel, .results-panel { padding: 24px; }
    .filter-title { margin: 0; font-size: 1.05rem; font-weight: 760; letter-spacing: -.02em; }
    .filters-panel .filter-title { margin-bottom: 18px; }
    .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px 10px; }
    .field { display: grid; gap: 7px; min-width: 0; }
    .field-wide { grid-column: span 2; }
    .field label, .variant label { color: #65616a; font-size: .7rem; font-weight: 750; letter-spacing: .055em; text-transform: uppercase; }
    .field input, .field select, .variant select { width: 100%; border: 1px solid rgba(104, 102, 109, .14); background: #f8f7fa; color: #242127; outline: none; transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease; }
    .field input, .field select { height: 48px; padding: 0 12px; border-radius: 13px; }
    .field input:hover, .field select:hover, .variant select:hover { border-color: rgba(129, 99, 139, .34); background: #fff; }
    .field input:focus, .field select:focus, .variant select:focus { border-color: var(--purple); background: #fff; box-shadow: 0 0 0 4px rgba(129, 99, 139, .12), 0 0 0 7px rgba(33, 150, 243, .035); }
    :focus-visible { outline: 2px solid rgba(33, 150, 243, .8); outline-offset: 2px; }
    .clear-button { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; margin-top: 14px; padding: 0 4px; border: 0; background: transparent; color: var(--purple); font-size: .82rem; font-weight: 700; }
    .clear-button::before { font-size: 1rem; content: "↻"; }
    .clear-button:hover { color: #5e3e69; }
    .filter-actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .result-count { margin: 0; color: var(--muted); font-size: .86rem; white-space: nowrap; }
    .products { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .product { display: flex; flex-direction: column; min-width: 0; min-height: 264px; padding: 19px; border: 1px solid rgba(129, 99, 139, .14); border-radius: 20px; background: #fff; box-shadow: 0 6px 20px rgba(42, 31, 47, .035); transition: transform 190ms ease, border-color 190ms ease, box-shadow 190ms ease; }
    .product:hover { transform: translateY(-2px); border-color: rgba(129, 99, 139, .3); box-shadow: 0 16px 32px rgba(59, 40, 68, .08); }
    .product-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { color: var(--purple); font-size: .7rem; font-weight: 850; letter-spacing: .09em; text-transform: uppercase; }
    .type { overflow: hidden; color: #89858d; font-size: .7rem; text-overflow: ellipsis; white-space: nowrap; }
    .product h2 { margin: 13px 0 11px; font-size: clamp(1.08rem, 1.6vw, 1.3rem); font-weight: 760; letter-spacing: -.035em; line-height: 1.18; }
    .specs { display: flex; flex-wrap: wrap; gap: 6px; min-height: 29px; margin-bottom: 17px; }
    .spec { padding: 6px 9px; border: 1px solid rgba(129, 99, 139, .08); border-radius: 999px; background: #f3eff5; color: #625368; font-size: .71rem; font-weight: 650; }
    .variant { display: grid; gap: 7px; margin-top: auto; }
    .variant select { height: 44px; padding: 0 11px; border-radius: 12px; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 17px; }
    .price { color: #17171a; font-size: 1.3rem; font-weight: 880; letter-spacing: -.035em; white-space: nowrap; }
    .add, .primary { border: 0; background: var(--brand); color: #fff; font-weight: 780; box-shadow: 0 8px 20px rgba(95, 87, 176, .2); transition: transform 180ms ease, filter 180ms ease, box-shadow 180ms ease; }
    .add { min-width: 104px; min-height: 44px; padding: 0 17px; border-radius: 12px; }
    .add:hover, .primary:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 11px 24px rgba(74, 91, 180, .27); }
    .add:active, .primary:active:not(:disabled) { transform: translateY(1px); }
    .order { padding: 21px; }
    .order-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .order h2 { margin: 0; font-size: 1.07rem; font-weight: 760; letter-spacing: -.02em; }
    .order-count { color: var(--purple); font-size: .8rem; font-weight: 700; }
    .selected { display: grid; gap: 9px; max-height: 48vh; margin-top: 16px; overflow: auto; scrollbar-color: var(--lavender) transparent; scrollbar-width: thin; }
    .selected-item { padding: 13px; border: 1px solid rgba(129, 99, 139, .13); border-radius: 15px; background: #fbfafc; }
    .selected-name { margin: 0; color: #272329; font-size: .86rem; font-weight: 760; line-height: 1.35; }
    .selected-variant { margin: 5px 0 11px; color: #77727b; font-size: .75rem; line-height: 1.4; }
    .selected-controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .quantity { display: flex; align-items: center; gap: 10px; }
    .quantity button, .remove { border: 1px solid rgba(129, 99, 139, .17); background: #fff; transition: border-color 180ms ease, background 180ms ease; }
    .quantity button { width: 34px; height: 34px; border-radius: 10px; color: var(--purple); font-size: 1rem; }
    .quantity button:hover { border-color: var(--purple-soft); background: #f4eff6; }
    .remove { min-height: 34px; padding: 0 9px; border-radius: 9px; color: #9a4051; font-size: .73rem; }
    .remove:hover { border-color: rgba(154, 64, 81, .28); background: #fff5f6; }
    .summary { margin-top: 18px; padding-top: 17px; border-top: 1px solid rgba(129, 99, 139, .13); }
    .total { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 1rem; font-weight: 700; }
    .total span:last-child { font-size: 1.2rem; font-weight: 880; letter-spacing: -.03em; }
    .primary { width: 100%; min-height: 48px; border-radius: 13px; }
    .primary:disabled { cursor: not-allowed; border: 1px solid #e0dce2; background: #eeebf0; color: #918c94; box-shadow: none; }
    .empty { grid-column: 1 / -1; margin: 0; padding: 38px 14px; color: #817c84; text-align: center; line-height: 1.5; }
    .order .empty { position: relative; padding: 55px 14px 24px; }
    .order .empty::before { position: absolute; top: 19px; left: 50%; display: grid; width: 28px; height: 28px; place-items: center; transform: translateX(-50%); border: 1px solid rgba(129, 99, 139, .18); border-radius: 9px; background: #f4eff6; color: var(--purple); content: "◇"; }
    @media (max-width: 1050px) { .layout { grid-template-columns: 360px minmax(0, 1fr); } .products { grid-template-columns: 1fr; } }
    @media (max-width: 900px) { .app { width: min(760px, calc(100% - 32px)); } .layout { grid-template-columns: 1fr; } .sidebar { position: static; } .products { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 650px) {
      .app { width: min(100% - 24px, 560px); margin: 22px auto 36px; }
      .header { display: block; margin-bottom: 26px; padding: 2px; }
      .header::after { bottom: -11px; left: 2px; }
      h1 { font-size: clamp(2rem, 10vw, 2.7rem); }
      .subtitle { margin-top: 11px; font-size: .91rem; }
      .stock-badge { margin-top: 17px; }
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filters > .field:first-child, .field-wide { grid-column: 1 / -1; }
      .products { grid-template-columns: 1fr; }
      .filters-panel, .results-panel, .order { padding: 17px; border-radius: 20px; }
      .product { min-height: 250px; padding: 17px; }
      .filter-actions { align-items: flex-start; }
      .result-count { white-space: normal; text-align: right; }
      .add { min-height: 46px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">Stock actualizado</p>
        <h1>Encontrá el modelo exacto</h1>
        <p class="subtitle">Filtrá por dispositivo, marca y especificaciones. Solo se muestran combinaciones presentes en el catálogo.</p>
      </div>
      <span id="stockBadge" class="stock-badge"></span>
    </header>

    <div class="layout">
      <div class="sidebar">
        <section class="panel filters-panel" aria-label="Filtros de stock">
          <h2 class="filter-title">1. Filtrá el stock</h2>
          <div class="filters">
            <div class="field"><label for="deviceType">Dispositivo</label><select id="deviceType"></select></div>
            <div class="field"><label for="brand">Marca</label><select id="brand"></select></div>
            <div class="field"><label for="model">Modelo</label><select id="model"></select></div>
            <div class="field"><label for="storage">Almacenamiento</label><select id="storage"></select></div>
            <div class="field"><label for="ram">Memoria RAM</label><select id="ram"></select></div>
            <div class="field"><label for="chip">Chip / procesador</label><select id="chip"></select></div>
            <div class="field"><label for="color">Color</label><select id="color"></select></div>
            <div class="field field-wide"><label for="search">Buscar configuración</label><input id="search" type="search" placeholder="Ej: Pro Max, Ultra, 512 GB…" autocomplete="off"></div>
            <div class="field field-wide"><label for="sort">Ordenar</label><select id="sort"><option value="catalog">Tipo y modelo</option><option value="price-asc">Menor precio</option><option value="price-desc">Mayor precio</option></select></div>
          </div>
          <button id="clearFilters" class="clear-button" type="button">Limpiar filtros</button>
        </section>

        <aside class="panel order" aria-label="Pedido seleccionado">
          <div class="order-heading"><h2>2. Tu pedido</h2><span id="orderCount" class="order-count">0 unidades</span></div>
          <div id="selected" class="selected"></div>
          <div class="summary">
            <div class="total"><span>Total</span><span id="total">USD 0</span></div>
            <button id="copyOrder" class="primary" type="button">Copiar pedido</button>
          </div>
        </aside>
      </div>

      <section class="panel results-panel" aria-label="Productos disponibles">
        <div class="filter-actions"><h2 class="filter-title">Productos disponibles</h2><p id="resultCount" class="result-count"></p></div>
        <div id="products" class="products"></div>
      </section>
    </div>
  </main>
  <script src="./src/data/catalog.browser.js"></script>
  <script src="./stock-widget.js"></script>
</body>
</html>
