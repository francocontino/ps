<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selector de stock</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color: #171717; background: #f5f5f3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(1240px, calc(100% - 28px)); margin: 32px auto; }
    .header { display: flex; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 6px; color: #087a55; font-size: .76rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3rem); letter-spacing: -.055em; }
    .subtitle { max-width: 620px; margin: 8px 0 0; color: #696965; line-height: 1.5; }
    .stock-badge { align-self: start; padding: 9px 12px; border-radius: 999px; background: #e5f6ee; color: #087a55; font-size: .82rem; font-weight: 800; white-space: nowrap; }
    .layout { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 18px; align-items: start; }
    .sidebar { display: grid; gap: 18px; position: sticky; top: 18px; }
    .panel { border: 1px solid #e2e2de; border-radius: 20px; background: #fff; box-shadow: 0 12px 40px rgb(0 0 0 / .045); }
    .filters-panel, .results-panel { padding: 20px; }
    .filter-title { margin: 0 0 14px; font-size: 1rem; }
    .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field-wide { grid-column: span 2; }
    .field label { color: #676763; font-size: .72rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
    .field input, .field select { width: 100%; height: 44px; padding: 0 11px; border: 1px solid #d9d9d4; border-radius: 11px; background: #fff; color: #20201e; outline: none; }
    .field input:focus, .field select:focus { border-color: #171717; box-shadow: 0 0 0 3px rgb(0 0 0 / .07); }
    .filter-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .result-count { margin: 0; color: #656560; font-size: .9rem; }
    .clear-button { border: 0; background: transparent; color: #555; font-size: .84rem; text-decoration: underline; }
    .products { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
    .product { display: flex; flex-direction: column; min-height: 230px; padding: 15px; border: 1px solid #e7e7e2; border-radius: 15px; }
    .product-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .brand { color: #087a55; font-size: .75rem; font-weight: 850; text-transform: uppercase; }
    .type { color: #7a7a75; font-size: .72rem; }
    .product h2 { margin: 10px 0 8px; font-size: 1rem; line-height: 1.3; }
    .specs { display: flex; flex-wrap: wrap; gap: 6px; min-height: 27px; margin-bottom: 12px; }
    .spec { padding: 5px 7px; border-radius: 7px; background: #f3f3f0; color: #565652; font-size: .72rem; }
    .variant { display: grid; gap: 5px; margin-top: auto; }
    .variant label { color: #666; font-size: .72rem; font-weight: 700; }
    .variant select { width: 100%; height: 38px; padding: 0 9px; border: 1px solid #d9d9d4; border-radius: 9px; background: #fff; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
    .price { font-size: 1.12rem; font-weight: 900; }
    .add, .primary { border: 0; border-radius: 10px; background: #171717; color: #fff; font-weight: 800; }
    .add { min-height: 38px; padding: 0 14px; }
    .add:hover, .primary:hover { background: #3b3b38; }
    .order { padding: 19px; }
    .order-heading { display: flex; justify-content: space-between; gap: 12px; }
    .order h2 { margin: 0; font-size: 1.15rem; }
    .order-count { color: #696965; font-size: .82rem; }
    .selected { display: grid; gap: 9px; max-height: 54vh; margin-top: 16px; overflow: auto; }
    .selected-item { padding: 11px; border: 1px solid #e6e6e1; border-radius: 12px; }
    .selected-name { margin: 0; font-size: .85rem; font-weight: 700; line-height: 1.35; }
    .selected-variant { margin: 4px 0 9px; color: #71716c; font-size: .76rem; }
    .selected-controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .quantity { display: flex; align-items: center; gap: 9px; }
    .quantity button, .remove { border: 1px solid #dcdcd7; background: #fff; }
    .quantity button { width: 29px; height: 29px; border-radius: 8px; }
    .remove { padding: 5px 8px; border-radius: 8px; color: #b42318; font-size: .75rem; }
    .summary { margin-top: 16px; padding-top: 15px; border-top: 1px solid #e5e5e0; }
    .total { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 1.08rem; font-weight: 900; }
    .primary { width: 100%; min-height: 44px; }
    .primary:disabled { cursor: not-allowed; opacity: .4; }
    .empty { grid-column: 1 / -1; margin: 0; padding: 32px 12px; color: #777772; text-align: center; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .sidebar { position: static; } }
    @media (max-width: 650px) {
      .app { margin: 18px auto; }
      .header { display: block; }
      .stock-badge { display: inline-block; margin-top: 14px; }
      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filters > .field:first-child, .field-wide { grid-column: 1 / -1; }
      .products { grid-template-columns: 1fr; }
      .filters-panel, .results-panel { padding: 14px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">Stock actualizado</p>
        <h1>Encontrá el modelo exacto</h1>
        <p class="subtitle">Filtrá por dispositivo, marca y especificaciones. Solo se muestran combinaciones presentes en el catálogo.</p>
      </div>
      <span id="stockBadge" class="stock-badge"></span>
    </header>

    <div class="layout">
      <div class="sidebar">
        <section class="panel filters-panel" aria-label="Filtros de stock">
          <h2 class="filter-title">1. Filtrá el stock</h2>
          <div class="filters">
            <div class="field"><label for="deviceType">Dispositivo</label><select id="deviceType"></select></div>
            <div class="field"><label for="brand">Marca</label><select id="brand"></select></div>
            <div class="field"><label for="model">Modelo</label><select id="model"></select></div>
            <div class="field"><label for="storage">Almacenamiento</label><select id="storage"></select></div>
            <div class="field"><label for="ram">Memoria RAM</label><select id="ram"></select></div>
            <div class="field"><label for="chip">Chip / procesador</label><select id="chip"></select></div>
            <div class="field"><label for="color">Color</label><select id="color"></select></div>
            <div class="field field-wide"><label for="search">Buscar configuración</label><input id="search" type="search" placeholder="Ej: Pro Max, Ultra, 512 GB…" autocomplete="off"></div>
            <div class="field field-wide"><label for="sort">Ordenar</label><select id="sort"><option value="catalog">Tipo y modelo</option><option value="price-asc">Menor precio</option><option value="price-desc">Mayor precio</option></select></div>
          </div>
          <button id="clearFilters" class="clear-button" type="button">Limpiar filtros</button>
        </section>

        <aside class="panel order" aria-label="Pedido seleccionado">
          <div class="order-heading"><h2>2. Tu pedido</h2><span id="orderCount" class="order-count">0 unidades</span></div>
          <div id="selected" class="selected"></div>
          <div class="summary">
            <div class="total"><span>Total</span><span id="total">USD 0</span></div>
            <button id="copyOrder" class="primary" type="button">Copiar pedido</button>
          </div>
        </aside>
      </div>

      <section class="panel results-panel" aria-label="Productos disponibles">
        <div class="filter-actions"><h2 class="filter-title">Productos disponibles</h2><p id="resultCount" class="result-count"></p></div>
        <div id="products" class="products"></div>
      </section>
    </div>
  </main>
  <script src="./src/data/catalog.browser.js"></script>
  <script src="./stock-widget.js"></script>
</body>
</html>
